<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sophia's Vocabulary Adventure</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#382b58;background:#f8efff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#ffdeef,transparent 50%),linear-gradient(145deg,#f9efff,#e6f7ff);min-height:100vh}.wrap{max-width:800px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(25px,5vw,39px);margin:15px 0 4px}.sub{color:#73658e}.card{background:#fff;border:2px solid #eadbf9;border-radius:25px;padding:24px;margin:18px 0;box-shadow:0 9px 25px #7563aa18}.hero{text-align:center}.avatar{font-size:70px}button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 18px;background:#8158cf;color:#fff;font-weight:750;min-height:48px}button:focus-visible{outline:3px solid #ffac39}button:disabled{opacity:.55;cursor:default}.soft{background:#f2e8ff;color:#59389b}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.choice{width:100%;background:#f6f0ff;color:#43325d;text-align:left;border:2px solid #e8dafb}.choice.good{background:#d8f8e5;border-color:#3bbf7e}.choice.bad{background:#ffe2e9;border-color:#e77996}.bar{height:12px;background:#f0e9fb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#9b71eb;transition:width .25s}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:9px 13px;border-radius:25px;background:white;font-weight:700}.feedback{min-height:28px;font-weight:700;margin:15px 0}.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.item{text-align:center;background:#faf5ff;padding:14px;border-radius:18px}.emoji{font-size:40px}.small{font-size:14px;color:#73658e}.hide{display:none}footer{text-align:center;color:#8b7c9e;padding:20px}@media(max-width:450px){.card{padding:17px}.options{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><div class="top"><span class="pill">💎 <span id="gems">0</span> gems</span><span class="pill">⭐ <span id="wins">0</span> correct</span></div><button class="soft" onclick="home()">🏠 Home</button></header><section id="screen"></section><footer>Made for Sophia 💜 • Progress saves on this device</footer></main><script>
const WORDS=[["compact","To press materials together so they take up less space."],["geologist","A scientist who studies rocks, Earth materials, and how Earth changes."],["model","A tool or representation used to show or explain something."],["cement","To stick sediment grains together, helping form solid rock."],["inference","A conclusion or explanation based on observations and what you already know."],["sedimentary rock","A solid material made when layers of sediment are pressed together and stuck together."],["fossil","A preserved remain, impression, or trace of a living thing from long ago."],["rock layer","A single section of rock found above or below another section."],["sediment","Small pieces of rock, minerals, or other material that can be moved by water, wind, or ice."],["observation","Information gathered by using your senses or tools to notice details."]];
const SCENARIOS=["The scientist who studies Earth's rocks is a ___ .","A footprint from a dinosaur long ago is a ___ .","Tiny sand and rock pieces carried by a river are ___ .","A single band of stone in a cliff is a ___ .","The scientist uses a small volcano ___ to explain an eruption.","You notice a rock has three colors. That detail is an ___ .","You decide the river once flowed here based on rounded stones. That's an ___ .","Pressure can ___ layers of loose material.","Minerals can ___ grains of sand into rock.","Layers of sediment can eventually form ___ ."];
const SCENARIO_ANSWERS=[1,6,8,7,2,9,4,0,3,5];
const STORE=[["🦄","Unicorn friend",35],["👑","Crystal crown",45],["🦋","Butterfly wings",55],["🐱","Kitty buddy",25],["🪄","Magic wand",40],["🦖","Dino buddy",30]];
let saved;try{saved=JSON.parse(localStorage.getItem("sophiaVocab1"))||{}}catch(e){saved={}}let data={gems:0,wins:0,owned:[],equipped:"🔎",...saved},session=null;
const el=document.getElementById("screen");function persist(){localStorage.setItem("sophiaVocab1",JSON.stringify(data));document.getElementById("gems").textContent=data.gems;document.getElementById("wins").textContent=data.wins}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function title(t){return '<h1>'+t+'</h1>'}function home(){session=null;el.innerHTML='<div class="card hero"><div class="avatar">👩🏻‍🔬'+data.equipped+'</div>'+title("Sophia’s Vocabulary Adventure")+'<p class="sub">Explore rocks, collect fossils, and become a vocabulary superstar!</p></div><div class="card"><h2>🗺️ Choose a mission</h2><div class="options"><button onclick="learn()">📚 Learn the Words</button><button onclick="start(\'match\')">🧠 Match the Meaning</button><button onclick="start(\'blank\')">✏️ Fill in the Blank</button><button onclick="start(\'detective\')">🔎 Rock Detective</button><button onclick="start(\'final\')">🏆 Final Challenge</button><button onclick="shop()">🛍️ Rewards Shop</button></div></div><div class="card"><b>🌟 Your progress</b><p>'+data.wins+' correct answers • '+data.gems+' gems earned and saved</p></div>'}
let flash=0;function learn(){session=null;flash=0;showFlash()}function showFlash(){let w=WORDS[flash];el.innerHTML='<div class="card hero">'+title("📚 Rock Explorer Flashcards")+'<p class="small">Word '+(flash+1)+' of '+WORDS.length+'</p><div class="bar"><div class="fill" style="width:'+((flash+1)*10)+'%"></div></div><h1>'+w[0]+'</h1><p style="font-size:20px;line-height:1.5">'+w[1]+'</p><div class="top" style="justify-content:center"><button class="soft" onclick="flash=Math.max(0,flash-1);showFlash()">← Previous</button><button onclick="flash=(flash+1)%WORDS.length;showFlash()">Next →</button></div></div>'}
function start(mode){session={mode,order:shuffle([...Array(10).keys()]),index:0,score:0,locked:false};question()}
function question(){let s=session;if(!s)return;if(s.index===10){finish();return}let i=s.order[s.index],w=WORDS[i],q,answer,choices;if(s.mode==="detective"||s.mode==="blank"){q=SCENARIOS[i];answer=WORDS[SCENARIO_ANSWERS[i]][0];choices=shuffle([answer,...shuffle(WORDS.map(x=>x[0]).filter(x=>x!==answer)).slice(0,3)])}else if(s.mode==="match"||s.mode==="final"){let useDef=s.mode==="match"||Math.random()>.5;if(useDef){q="Which word matches this definition?<p><strong>"+w[1]+"</strong></p>";answer=w[0];choices=shuffle([answer,...shuffle(WORDS.map(x=>x[0]).filter(x=>x!==answer)).slice(0,3)])}else{q="What does <strong>"+w[0]+"</strong> mean?";answer=w[1];choices=shuffle([answer,...shuffle(WORDS.map(x=>x[1]).filter(x=>x!==answer)).slice(0,3)])}}s.answer=answer;s.locked=false;el.innerHTML='<div class="card"><p class="small">Mission: '+s.mode.toUpperCase()+' • Question '+(s.index+1)+' / 10</p><div class="bar"><div class="fill" style="width:'+(s.index*10)+'%"></div></div><h2>'+q+'</h2><div class="options" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="hide" onclick="session.index++;question()">Next question →</button></div>';let target=document.getElementById("choices");choices.forEach(c=>{let b=document.createElement("button");b.className="choice";b.textContent=c;b.onclick=()=>answerClick(c,b);target.appendChild(b)})}
function answerClick(choice,b){let s=session;if(!s||s.locked)return;s.locked=true;let ok=choice===s.answer;if(ok){s.score++;data.wins++;data.gems+=5}else{data.gems+=1}persist();document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===s.answer)x.classList.add("good")});if(!ok)b.classList.add("bad");document.getElementById("feedback").textContent=ok?"🎉 Correct! +5 gems":"💜 Keep learning! The answer is: "+s.answer+" (+1 gem)";document.getElementById("next").classList.remove("hide")}
function finish(){let s=session;el.innerHTML='<div class="card hero"><div class="avatar">'+(s.score>=8?"🏆":"🌈")+'</div>'+title("Mission Complete!")+'<h2>'+s.score+' / 10 correct</h2><p>'+(s.score===10?"Perfect score! Amazing, Sophia!":s.score>=7?"Great exploring!":"Practice makes you stronger!")+'</p><div class="top" style="justify-content:center"><button onclick="start(\''+s.mode+'\')">Play again</button><button class="soft" onclick="home()">Mission Map</button><button class="soft" onclick="shop()">Rewards Shop</button></div></div>';session=null}
function shop(){session=null;el.innerHTML='<div class="card">'+title("🛍️ Crystal Rewards Shop")+'<p>Earn gems by practicing. Choose a friend or accessory for your explorer!</p><p>💎 Available: '+data.gems+'</p><div class="shop">'+STORE.map((x,i)=>'<div class="item"><div class="emoji">'+x[0]+'</div><b>'+x[1]+'</b><p class="small">'+x[2]+' gems</p><button '+(!data.owned.includes(i)&&data.gems<x[2]?'disabled':'')+' onclick="buy('+i+')">'+(data.owned.includes(i)?data.equipped===x[0]?'Equipped ✓':'Equip':'Unlock')+'</button></div>').join("")+'</div></div>'}
function buy(i){let x=STORE[i];if(!data.owned.includes(i)){if(data.gems<x[2])return;data.gems-=x[2];data.owned.push(i)}data.equipped=x[0];persist();shop()}persist();home();
</script></body></html>
